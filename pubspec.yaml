name: aud_audio_graph
description: "Audio graph engine of the Audanika Audio Engine: C++ render programs, scheduler, transport, headless host; Dart graph API"
version: 1.0.0
publish_to: none
homepage: https://github.com/audaudio/aud_audio_graph
repository: https://github.com/audaudio/aud_audio_graph

environment:
  sdk: ^3.14.0

# The example resolves together with the package, so that upgrading the
# package upgrades the example too.
workspace:
  - example

dependencies:
  ffi: ^2.2.0
  aud_audio_core:
    git:
      url: git@github.com:audaudio/aud_audio_core.git
      tag_pattern: "{{version}}"
    version: ^1.0.0
  code_assets: ^2.2.0
  hooks: ^2.2.0
  logging: ^1.3.0
  native_toolchain_c: ^0.19.6

dev_dependencies:
  aud_midi_standard: ^1.0.0
  dna_audanika: ^0.1.0
  ffigen: ^23.0.0
  flutter_lints: ^6.0.0
  # Within the test_api that flutter_test of the example pins.
  test: ^1.32.0