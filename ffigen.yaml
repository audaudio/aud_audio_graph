# Run with `dart run ffigen --config ffigen.yaml`.
name: AudAudioGraphBindings
description: |
  Bindings for `src/aud_audio_graph.h`. The structs of the ABI come from the
  bindings of aud_audio_core, so a host builds one `AudEvent` for both.

  Regenerate bindings with `dart run ffigen --config ffigen.yaml`.
output: 'lib/src/aud_audio_graph_bindings_generated.dart'
headers:
  entry-points:
    - 'src/aud_audio_graph.h'
  include-directives:
    - 'src/aud_audio_graph.h'
compiler-opts:
  - '-I../aud_audio_core/src'
ffi-native:
library-imports:
  core: 'package:aud_audio_core/aud_audio_core_bindings.dart'
type-map:
  structs:
    AudEvent:
      lib: core
      c-type: AudEvent
      dart-type: AudEvent
    AudTimestamp:
      lib: core
      c-type: AudTimestamp
      dart-type: AudTimestamp
    AudHostApi:
      lib: core
      c-type: AudHostApi
      dart-type: AudHostApi
    AudNodeDescriptor:
      lib: core
      c-type: AudNodeDescriptor
      dart-type: AudNodeDescriptor
    AudRenderRequest:
      lib: core
      c-type: AudRenderRequest
      dart-type: AudRenderRequest
    AudTransportRequest:
      lib: core
      c-type: AudTransportRequest
      dart-type: AudTransportRequest
    AudAudioBus:
      lib: core
      c-type: AudAudioBus
      dart-type: AudAudioBus
preamble: |
  // @license
  // Copyright (c) Audanika. All Rights Reserved.
  //
  // Use of this source code is governed by terms that can be
  // found in the LICENSE file in the root of this package.

  // Generated by ffigen; the struct helpers it emits are not exercised.
  // coverage:ignore-file
comments:
  style: any
  length: full
